<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:dark;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font:14px/1.4 system-ui,sans-serif}img{max-width:100%}[hidden]{display:none!important}</style></head><body>
<title>Last Z Tasks</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@600;700&family=Share+Tech+Mono&family=Mulish:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  /* The Last Z Tasks dashboard. It runs on claude.ai only: each user publishes their own private copy,
     and it reads runs from the page's own database (collection "runs"), which the last-z-log-run
     skill keeps identical to data/runs.json in the user's Last-Z-Tasks folder.
     Visual style inspired by lastz.gg. Dark only, by design. */
  :root {
    /* High-contrast pass: no greys. Secondary text is warm off-white, small labels are soft orange. */
    --bg: #090d15;
    --panel: #141c2b;
    --panel-2: #1b2638;
    --line: #3b4c69;
    --line-soft: #2e3d56;
    --ink: #fbf8f2;
    --ink-2: #ece6dc;
    --label: #ffaa70;
    --accent: #ff6a1a;
    --accent-soft: rgba(255, 106, 26, 0.18);
    --ok: #3fd18f;
    --warn: #ffb547;
    --bad: #ff5c61;
    --display: "Rajdhani", "Barlow Condensed", "Arial Narrow", sans-serif;
    --mono: "Share Tech Mono", ui-monospace, "SF Mono", Menlo, monospace;
    --body: "Mulish", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    color-scheme: dark;
  }
  * { box-sizing: border-box; }
  html { background: var(--bg); }
  body {
    margin: 0;
    color: var(--ink);
    font: 15px/1.5 var(--body);
    background:
      radial-gradient(900px 420px at 85% -120px, rgba(255, 106, 26, 0.18), transparent 70%),
      linear-gradient(rgba(255,255,255,0.018) 1px, transparent 1px) 0 0 / 100% 4px,
      var(--bg);
    min-height: 100vh;
  }
  body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--bg); }
  button { font: inherit; color: inherit; }
  .wrap { max-width: 1080px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }

  /* Top bar */
  .topbar { border-bottom: 1px solid var(--line); background: rgba(9, 13, 21, 0.92); backdrop-filter: blur(6px); position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; }
  .topbar .bar { display: flex; align-items: center; justify-content: space-between; height: 58px; gap: 12px; }
  .brand { display: flex; align-items: center; gap: 10px; font: 700 21px/1 var(--display); letter-spacing: 0.04em; white-space: nowrap; }
  .brand svg { flex: none; }
  .brand b { color: var(--accent); font-weight: 700; }
  .sync { display: flex; align-items: center; gap: 8px; font: 12px/1 var(--mono); letter-spacing: 0.12em; color: var(--ink-2); border: 1px solid var(--line); padding: 8px 12px; border-radius: 3px; text-transform: uppercase; white-space: nowrap; }
  .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--ok); box-shadow: 0 0 8px var(--ok); flex: none; }
  .dot.wait { background: var(--warn); box-shadow: 0 0 8px var(--warn); }

  /* Section jump bar (phones only) */
  .topbar .jump { display: none; }
  section, .anchor { scroll-margin-top: calc(110px + env(safe-area-inset-top, 0px)); }

  /* Hero */
  .hero { padding: 40px 0 8px; }
  .kicker { font: 12px/1 var(--mono); letter-spacing: 0.22em; color: var(--accent); text-transform: uppercase; display: flex; align-items: center; gap: 10px; }
  .kicker::before { content: ""; width: 22px; height: 1px; background: var(--accent); }
  h1 { font: 700 clamp(44px, 7vw, 72px)/0.95 var(--display); letter-spacing: 0.05em; text-transform: uppercase; margin: 14px 0 10px; text-wrap: balance; }
  h1 span { color: var(--accent); }
  .lede { color: var(--ink-2); margin: 0; }

  /* Sections */
  section { margin-top: 44px; }
  .sec-head { display: flex; align-items: end; justify-content: space-between; gap: 16px; flex-wrap: wrap; margin-bottom: 16px; }
  h2 { font: 700 24px/1 var(--display); letter-spacing: 0.1em; text-transform: uppercase; margin: 0; padding-bottom: 12px; position: relative; display: flex; align-items: center; gap: 10px; }
  h2::after { content: ""; position: absolute; left: 0; bottom: 0; width: 38px; height: 3px; background: var(--accent); }
  h2 .ico { color: var(--accent); font-size: 18px; }
  .hint { font: 11.5px/1 var(--mono); letter-spacing: 0.12em; color: var(--label); text-transform: uppercase; }

  /* Filters */
  .filters { display: flex; flex-wrap: wrap; gap: 14px 22px; align-items: center; padding: 12px 14px; background: var(--panel); border: 1px solid var(--line); border-radius: 3px; }
  .fgroup { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
  .fgroup > span { font: 11px/1 var(--mono); letter-spacing: 0.16em; text-transform: uppercase; color: var(--label); margin-right: 4px; }
  .chip { font: 600 13px/1 var(--display); letter-spacing: 0.1em; text-transform: uppercase; background: transparent; border: 1px solid var(--line); border-radius: 3px; padding: 7px 11px; cursor: pointer; color: var(--ink-2); }
  .chip:hover { border-color: var(--accent); color: var(--ink); }
  .chip[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: #fff; }
  .chip:focus-visible, summary:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

  /* Activity chart */
  .chart-card { background: var(--panel); border: 1px solid var(--line); border-radius: 3px; padding: 16px 16px 10px; margin-top: 12px; position: relative; }
  .chart-title { display: flex; justify-content: space-between; gap: 10px; font: 11px/1 var(--mono); letter-spacing: 0.16em; text-transform: uppercase; color: var(--ink-2); margin-bottom: 10px; }
  .chart-title b { color: var(--accent); font-weight: 400; }
  .plot { position: relative; height: 170px; }
  .plot svg { position: absolute; inset: 0; display: block; width: 100%; height: 100%; }
  .plot .grid { stroke: var(--line-soft); stroke-width: 1; }
  .plot .base { stroke: var(--line); stroke-width: 1; }
  .bars { position: absolute; inset: 0; }
  .bm { position: absolute; bottom: 22px; transform: translateX(-50%); background: var(--accent); border-radius: 4px 4px 0 0; pointer-events: none; }
  .hit { position: absolute; top: 0; bottom: 22px; cursor: default; }
  .hit:hover { background: rgba(255, 255, 255, 0.07); }
  .ylab span { position: absolute; left: 0; font: 10.5px/1 var(--mono); color: var(--label); }
  .xlab span { position: absolute; bottom: 2px; transform: translateX(-50%); font: 10.5px/1 var(--mono); color: var(--label); white-space: nowrap; }
  .tip { position: absolute; pointer-events: none; background: #05080e; border: 1px solid var(--line); border-top: 2px solid var(--accent); border-radius: 3px; padding: 8px 10px; font: 12px/1.45 var(--body); color: var(--ink); min-width: 150px; opacity: 0; transform: translate(-50%, -100%); transition: opacity 0.1s; z-index: 3; }
  .tip.on { opacity: 1; }
  .tip .t-date { font: 11px/1 var(--mono); letter-spacing: 0.12em; color: var(--accent); text-transform: uppercase; margin-bottom: 5px; }
  .tip .t-row { display: flex; justify-content: space-between; gap: 14px; color: var(--ink-2); }
  .tip .t-row b { color: var(--ink); font-weight: 600; font-variant-numeric: tabular-nums; }

  /* Disclosure (shared) */
  details > summary { list-style: none; cursor: pointer; }
  details > summary::-webkit-details-marker { display: none; }
  .chev { width: 18px; height: 18px; flex: none; color: var(--label); transition: transform 0.15s; }
  details[open] > summary .chev { transform: rotate(90deg); color: var(--accent); }
  @media (prefers-reduced-motion: reduce) { .chev, .tip { transition: none; } }

  /* Run log */
  .days { display: grid; gap: 10px; margin-top: 12px; }
  .day { background: var(--panel); border: 1px solid var(--line); border-radius: 3px; }
  .day > summary { display: flex; align-items: center; gap: 12px; padding: 13px 16px; min-height: 52px; }
  .day > summary:hover { background: var(--panel-2); }
  .day-name { font: 700 18px/1 var(--display); letter-spacing: 0.08em; text-transform: uppercase; }
  .day-count { margin-left: auto; font: 14px/1 var(--mono); letter-spacing: 0.06em; color: var(--ink); white-space: nowrap; font-variant-numeric: tabular-nums; }
  .day-count.short { color: var(--warn); }
  .day-body { border-top: 1px solid var(--line); }

  .run { border-bottom: 1px solid var(--line-soft); }
  .run:last-child { border-bottom: 0; }
  .run > summary { display: grid; grid-template-columns: 18px 72px minmax(0, 1fr) auto; align-items: center; gap: 12px; padding: 12px 16px; min-height: 48px; }
  .run > summary:hover { background: var(--panel-2); }
  .r-time { font: 13.5px/1 var(--mono); color: var(--ink-2); white-space: nowrap; }
  .r-task { font-weight: 700; font-size: 15px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .r-count { font: 16px/1 var(--mono); text-align: right; font-variant-numeric: tabular-nums; color: var(--ink); }
  .r-count.partial { color: var(--warn); }
  .r-count.failed { color: var(--bad); }

  /* Run details: one item per line, label left, value right */
  .run-body { padding: 4px 16px 16px 46px; background: rgba(0,0,0,0.16); }
  .stack { max-width: 560px; }
  .row { display: flex; justify-content: space-between; align-items: baseline; gap: 16px; padding: 10px 0; border-bottom: 1px solid var(--line-soft); }
  .row .k, .block .k { font: 11px/1.4 var(--mono); letter-spacing: 0.14em; text-transform: uppercase; color: var(--label); flex: none; }
  .row .v { color: var(--ink); font-size: 14.5px; text-align: right; min-width: 0; overflow-wrap: anywhere; }
  .row .v.mono { font-family: var(--mono); font-size: 14px; }
  .row .v .spent { color: var(--ink-2); }
  .row .v.complete { color: var(--ok); }
  .row .v.partial { color: var(--warn); }
  .row .v.failed { color: var(--bad); }
  .row.id .v { font-family: var(--mono); font-size: 12.5px; color: var(--ink-2); }
  .block { padding: 12px 0 10px; border-bottom: 1px solid var(--line-soft); }
  .block .k { display: block; margin-bottom: 8px; }
  .block .v { color: var(--ink); font-size: 14.5px; }
  .issues { margin: 0; padding: 0; list-style: none; display: grid; gap: 5px; }
  .issues li { display: flex; gap: 8px; color: var(--ink-2); font-size: 13.5px; }
  .issues li::before { content: "▲"; color: var(--warn); font-size: 9px; line-height: 20px; }

  /* States */
  .notice { background: var(--panel); border: 1px dashed var(--line); border-radius: 3px; padding: 26px; text-align: center; color: var(--ink-2); margin-top: 26px; }
  .notice code { font-family: var(--mono); color: var(--accent); background: var(--accent-soft); padding: 2px 7px; border-radius: 3px; }
  .notice.error { border-color: var(--bad); color: #ffd0d2; }
  .empty-filter { padding: 22px; text-align: center; color: var(--ink-2); background: var(--panel); border: 1px dashed var(--line); border-radius: 3px; }
  .empty-filter .reset { margin-top: 14px; min-height: 40px; padding: 0 16px; background: var(--accent); border-color: var(--accent); color: #fff; }

  footer { margin: 56px 0 28px; padding-top: 16px; border-top: 1px solid var(--line); display: flex; justify-content: space-between; flex-wrap: wrap; gap: 8px; font: 11px/1.6 var(--mono); letter-spacing: 0.1em; color: var(--ink-2); text-transform: uppercase; }

  @media (max-width: 760px) {
    .topbar .bar { height: 52px; }
    .brand { font-size: 19px; }
    .sync { padding: 7px 10px; }
    .sync .long { display: none; }
    .topbar .jump { display: flex; gap: 6px; padding-top: 0; padding-bottom: 10px; overflow-x: auto; scrollbar-width: none; }
    .jump::-webkit-scrollbar { display: none; }
    .jump button { flex: none; font: 600 13px/1 var(--display); letter-spacing: 0.1em; text-transform: uppercase; color: var(--ink); background: var(--panel); border: 1px solid var(--line); border-radius: 3px; padding: 0 12px; min-height: 36px; cursor: pointer; }
    .jump button:active { border-color: var(--accent); }

    .hero { padding: 22px 0 2px; }
    .kicker { font-size: 10.5px; letter-spacing: 0.18em; }
    h1 { font-size: 42px; margin: 10px 0 6px; }
    .lede { font-size: 14px; }

    section { margin-top: 32px; }
    .sec-head { margin-bottom: 12px; }
    h2 { font-size: 22px; padding-bottom: 10px; }
    .hint { display: none; }

    /* Filters: one swipeable row per group, thumb-sized buttons */
    .filters { display: grid; gap: 10px; padding: 12px; }
    .fgroup { flex-wrap: nowrap; overflow-x: auto; scrollbar-width: none; margin: 0 -12px; padding: 0 12px; }
    .fgroup::-webkit-scrollbar { display: none; }
    .fgroup > span { flex: none; width: 56px; }
    .chip { flex: none; min-height: 40px; padding: 0 13px; }

    .chart-card { padding: 14px 12px 8px; }
    .chart-title { flex-direction: column; gap: 6px; }

    .day > summary { padding: 12px 14px; }
    .day-name { font-size: 17px; }

    .run > summary { grid-template-columns: 18px 64px minmax(0, 1fr) auto; gap: 10px; padding: 12px 14px; min-height: 52px; }
    .run-body { padding: 2px 14px 14px; }
    .stack { max-width: none; }

    .notice { padding: 20px 16px; }
    footer { flex-direction: column; gap: 4px; margin-top: 40px; }
  }
</style>

<header class="topbar">
  <div class="wrap bar">
    <div class="brand">
      <svg width="26" height="26" viewBox="0 0 26 26" aria-hidden="true">
        <rect x="3" y="3" width="20" height="20" rx="2" fill="none" stroke="#ff6a1a" stroke-width="2"/>
        <path d="M8 9h10l-10 8h10" fill="none" stroke="#fbf8f2" stroke-width="2" stroke-linejoin="round"/>
      </svg>
      <span>LAST Z <b>TASKS</b></span>
    </div>
    <div class="sync"><span class="dot wait" id="sync-dot"></span><span id="sync-text">Loading</span></div>
  </div>
  <nav class="jump wrap" aria-label="Sections">
    <button data-jump="activity">Activity</button><button data-jump="log">Run log</button>
  </nav>
</header>

<main class="wrap" id="app">
  <div class="hero"><div class="kicker">// Last Z · Survival Shooter</div><h1>Task <span>Ops</span></h1><p class="lede">Loading your runs…</p></div>
</main>

<script>
(function () {
  var app = document.getElementById("app");
  var STORE = "lz-dashboard-v2";
  var CHEV = '<svg class="chev" viewBox="0 0 20 20" aria-hidden="true"><path d="M7 4l6 6-6 6" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>';
  var STATUS = {
    complete: { ic: "✓", label: "Complete" },
    partial: { ic: "◐", label: "Partial" },
    failed: { ic: "✕", label: "Failed" }
  };

  // ---------- helpers ----------
  function esc(s) {
    return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) {
      return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
    });
  }
  function num(v) { return typeof v === "number" && isFinite(v) ? v : 0; }
  function ymd(d) {
    return d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0");
  }
  function parseYmd(s) { var p = s.split("-"); return new Date(+p[0], +p[1] - 1, +p[2]); }
  function addDays(d, n) { var x = new Date(d); x.setDate(x.getDate() + n); return x; }
  function today() { return ymd(new Date()); }
  function dayName(iso) {
    if (iso === today()) return "Today";
    if (iso === ymd(addDays(new Date(), -1))) return "Yesterday";
    return parseYmd(iso).toLocaleDateString(undefined, { weekday: "short", month: "short", day: "numeric" });
  }
  function clock(hhmm) {
    if (!hhmm || !/^\d{1,2}:\d{2}$/.test(hhmm)) return "—";
    var p = hhmm.split(":"); var d = new Date(); d.setHours(+p[0], +p[1]);
    return d.toLocaleTimeString(undefined, { hour: "numeric", minute: "2-digit" });
  }
  function nowClock() { return new Date().toLocaleTimeString(undefined, { hour: "numeric", minute: "2-digit" }); }
  function ago(r) {
    var p = (r.time || "00:00").split(":");
    var d = parseYmd(r.date); d.setHours(+p[0] || 0, +p[1] || 0);
    var m = Math.round((Date.now() - d) / 60000);
    if (m < 1) return "just now";
    if (m < 60) return m + " min ago";
    if (m < 1440) return Math.round(m / 60) + " h ago";
    return Math.round(m / 1440) + " d ago";
  }
  function fuelSpent(r) {
    var x = r.resources && r.resources.fuel;
    return x && typeof x.before === "number" && typeof x.after === "number" ? Math.max(0, x.before - x.after) : 0;
  }
  function settingsText(s) {
    if (!s || typeof s !== "object") return "";
    return Object.keys(s).map(function (k) { return k === "level" ? "Lv." + s[k] : k + " " + s[k]; }).join(" · ");
  }
  function pct(a, b) { return b ? Math.round((a / b) * 100) : 0; }
  function sum(list, f) { return list.reduce(function (n, r) { return n + num(f(r)); }, 0); }
  function statusOf(r) { return STATUS[r.status] ? r.status : "complete"; }
  // Short names for the run log. New tasks can log their own "short" field instead.
  var SHORT = { "running-boomers": "Boomers" };
  function shortName(r) { return r.short || SHORT[r.task] || r.label || r.task; }
  function clockTight(hhmm) { return clock(hhmm).replace(/[\s\u202f]+([AP]M)$/i, "$1"); }
  function settingRows(s) {
    if (!s || typeof s !== "object") return "";
    return Object.keys(s).map(function (k) {
      var name = k === "level" ? "Level" : k.charAt(0).toUpperCase() + k.slice(1);
      return row(name, esc(s[k]));
    }).join("");
  }
  function row(k, v, cls, vcls) { return '<div class="row' + (cls ? " " + cls : "") + '"><span class="k">' + esc(k) + '</span><span class="v' + (vcls ? " " + vcls : "") + '">' + v + "</span></div>"; }
  function setSync(text, live) {
    document.getElementById("sync-text").innerHTML = text;
    document.getElementById("sync-dot").className = "dot" + (live ? "" : " wait");
  }

  // ---------- saved view state (filters, open panels, scroll) ----------
  var state = { task: "all", status: "all", range: "14", open: {}, scroll: 0 };
  try { var saved = JSON.parse(localStorage.getItem(STORE) || "null"); if (saved) for (var k in saved) state[k] = saved[k]; } catch (e) {}
  function save() { try { state.scroll = window.scrollY; localStorage.setItem(STORE, JSON.stringify(state)); } catch (e) {} }

  // Remember which panels are open (toggle doesn't bubble, so capture it).
  document.addEventListener("toggle", function (e) {
    var key = e.target && e.target.getAttribute && e.target.getAttribute("data-key");
    if (!key) return;
    state.open[key] = e.target.open;
    save();
  }, true);
  window.addEventListener("beforeunload", save);

  document.querySelector(".jump").addEventListener("click", function (e) {
    var b = e.target.closest("button[data-jump]"); if (!b) return;
    var el = document.getElementById("sec-" + b.getAttribute("data-jump"));
    if (el) el.scrollIntoView({ behavior: window.matchMedia("(prefers-reduced-motion: reduce)").matches ? "auto" : "smooth", block: "start" });
  });
  var lastW = window.innerWidth, rt;
  window.addEventListener("resize", function () {
    if (window.innerWidth === lastW || !data.runs.length) return;
    lastW = window.innerWidth; clearTimeout(rt); rt = setTimeout(function () { renderChart(filtered()); }, 150);
  });

  // ---------- data sources ----------
  var data = { runs: [], tasks: {}, taskOrder: [], skipped: 0 };
  var firstPaint = true;

  if (!window.claude) {
    // Opened outside Claude (for example as a file): there's no database to read here.
    notice('This dashboard runs in Claude. Ask Claude to <code>open my Last Z dashboard</code>.');
    setSync("Open in Claude", false);
  } else {
    setSync('<span class="long">Connecting · </span>' + nowClock(), false);
    window.claude.use("db").then(function (db) {
      if (!db) {
        notice("Your runs couldn't load here. Open this dashboard in Claude while signed in to the account that owns it.");
        setSync("Offline", false);
        return;
      }
      db.collection("runs").onSnapshot(function (snap) {
        render(snap.docs.map(function (d) { return d.data(); }));
        setSync('<span class="long">Live · updated </span>' + nowClock(), true);
      }, function () {
        setSync("Disconnected · reload", false);
      });
    }, function () {
      notice("Your runs couldn't load here. Open this dashboard in Claude while signed in.");
    });
  }

  function notice(html, isError) {
    app.innerHTML = hero("") + '<div class="notice' + (isError ? " error" : "") + '">' + html + "</div>";
  }

  // ---------- main render ----------
  function render(raw) {
    var runs = (raw || []).filter(function (r) {
      return r && typeof r.task === "string" && typeof r.date === "string" && /^\d{4}-\d{2}-\d{2}$/.test(r.date);
    });
    var skipped = (raw || []).length - runs.length;
    runs.sort(function (a, b) { return (b.date + (b.time || "")).localeCompare(a.date + (a.time || "")); });

    var tasks = {}, taskOrder = [];
    runs.slice().reverse().forEach(function (r) {
      if (!tasks[r.task]) { tasks[r.task] = { key: r.task, label: r.label || r.task, runs: [] }; taskOrder.push(r.task); }
      tasks[r.task].runs.unshift(r);
      if (r.label) tasks[r.task].label = r.label;
    });
    if (state.task !== "all" && !tasks[state.task]) state.task = "all";
    data = { runs: runs, tasks: tasks, taskOrder: taskOrder, skipped: skipped };

    var warning = skipped
      ? '<div class="notice error">' + skipped + " log " + (skipped === 1 ? "entry is" : "entries are") +
        " missing a task or date and " + (skipped === 1 ? "was" : "were") + " skipped. Ask Claude to <code>check the Last Z run log</code>.</div>"
      : "";

    if (!runs.length) {
      app.innerHTML = hero("No runs logged yet") + warning +
        '<div class="notice">Ask Claude to run a task, like <code>run 10 boomers</code>. It shows up here when it finishes.</div>';
      return;
    }

    var html = '<div id="sec-overview" class="anchor">' + hero(runs.length + (runs.length === 1 ? " run" : " runs") + " logged · last run " + ago(runs[0])) + warning + "</div>";

    html += '<section id="sec-activity"><div class="sec-head"><h2><span class="ico">◆</span>Activity</h2><span class="hint">Filters apply to the chart and run log</span></div>' +
      '<div class="filters" id="filters"></div>' +
      '<div class="chart-card" id="chart-card"></div></section>' +
      '<section id="sec-log"><div class="sec-head"><h2><span class="ico">◆</span>Run log</h2><span class="hint">Tap a day or run for details</span></div>' +
      '<div class="days" id="days"></div></section>';

    html += "<footer><span>Synced from data/runs.json in your Last-Z-Tasks folder" +
      "</span><span>Style inspired by lastz.gg · fan-made, unofficial</span></footer>";

    var y = window.scrollY;
    app.innerHTML = html;
    renderFilters();
    renderFiltered();
    if (!firstPaint) window.scrollTo(0, y);
    firstPaint = false;
  }

  // ---------- builders ----------
  function hero(sub) {
    return '<div class="hero"><div class="kicker">// Last Z · Survival Shooter</div><h1>Task <span>Ops</span></h1>' +
      (sub ? '<p class="lede">' + esc(sub) + "</p>" : "") + "</div>";
  }
  function renderFilters() {
    var el = document.getElementById("filters");
    function group(name, field, opts) {
      return '<div class="fgroup" role="group" aria-label="' + name + '"><span>' + name + "</span>" +
        opts.map(function (o) {
          return '<button class="chip" id="f-' + field + "-" + esc(o[0]) + '" data-field="' + field + '" data-value="' + esc(o[0]) + '" aria-pressed="' + (state[field] === o[0]) + '">' + esc(o[1]) + "</button>";
        }).join("") + "</div>";
    }
    el.innerHTML =
      group("Range", "range", [["7", "7D"], ["14", "14D"], ["30", "30D"], ["all", "All"]]) +
      (data.taskOrder.length > 1 ? group("Task", "task", [["all", "All"]].concat(data.taskOrder.map(function (k) { return [k, data.tasks[k].label]; }))) : "") +
      group("Status", "status", [["all", "All"], ["complete", "Complete"], ["partial", "Partial"], ["failed", "Failed"]]);
    el.onclick = function (e) {
      var b = e.target.closest("button.chip"); if (!b) return;
      state[b.getAttribute("data-field")] = b.getAttribute("data-value");
      save(); renderFilters(); renderFiltered();
    };
  }

  function filtered() {
    var start = state.range === "all" ? null : ymd(addDays(new Date(), -(+state.range - 1)));
    return data.runs.filter(function (r) {
      return (state.task === "all" || r.task === state.task) &&
        (state.status === "all" || statusOf(r) === state.status) &&
        (!start || r.date >= start);
    });
  }

  function renderFiltered() {
    var list = filtered();
    renderChart(list);
    renderDays(list);
  }

  function renderChart(list) {
    var card = document.getElementById("chart-card");
    var end = new Date();
    var oldest = data.runs[data.runs.length - 1].date;
    var nDays = state.range === "all"
      ? Math.min(90, Math.max(7, Math.round((end - parseYmd(oldest)) / 86400000) + 1))
      : +state.range;
    var days = [];
    for (var i = nDays - 1; i >= 0; i--) {
      var d = ymd(addDays(end, -i));
      var dr = list.filter(function (r) { return r.date === d; });
      days.push({ date: d, runs: dr.length, done: sum(dr, function (r) { return r.completed; }), fuel: sum(dr, fuelSpent) });
    }
    var total = sum(days, function (d) { return d.done; });
    var max = Math.max(1, Math.max.apply(null, days.map(function (d) { return d.done; })));
    var nice = max <= 5 ? 5 : max <= 10 ? 10 : Math.ceil(max / 10) * 10;

    var W = 1000, H = 170, padL = 34, padB = 22, padT = 8;
    var plotW = W - padL, plotH = H - padB - padT;
    var colW = plotW / nDays, barW = Math.max(3, Math.min(28, colW * 0.56));
    var svg = '<svg viewBox="0 0 ' + W + " " + H + '" preserveAspectRatio="none" role="img" aria-label="Completed per day, last ' + nDays + ' days">';
    [0, 0.5, 1].forEach(function (f) {
      var y = padT + plotH - plotH * f;
      svg += '<line class="' + (f === 0 ? "base" : "grid") + '" x1="' + padL + '" x2="' + W + '" y1="' + y + '" y2="' + y + '"/>';
    });
    svg += "</svg>";

    // Bars and labels are HTML, positioned in percentages, so text never stretches with the SVG.
    // Space date labels by the chart's real width (about 40px each) so they never collide on a phone.
    var plotPx = Math.max(200, card.clientWidth - 32);
    var fit = Math.max(2, Math.floor((plotPx * (plotW / W)) / 40));
    var step = Math.max(1, Math.ceil(nDays / fit));
    var labels = "", bars = "";
    days.forEach(function (d, i) {
      var cx = padL + colW * i + colW / 2;
      var h = d.done ? Math.max(3, (d.done / nice) * plotH) : 0;
      var left = (cx / W) * 100;
      if (h) bars += '<div class="bm" style="left:' + left + "%;width:" + (barW / W) * 100 + "%;height:" + h + 'px"></div>';
      bars += '<div class="hit" data-i="' + i + '" style="left:' + ((padL + colW * i) / W) * 100 + "%;width:" + (colW / W) * 100 + '%"></div>';
      if ((nDays - 1 - i) % step === 0) {
        labels += '<span style="left:' + left + '%">' + (d.date === today() ? "Today" : parseYmd(d.date).toLocaleDateString(undefined, { month: "numeric", day: "numeric" })) + "</span>";
      }
    });
    var yl = [0, nice / 2, nice].map(function (v, i) {
      return '<span style="bottom:' + (padB + plotH * (i / 2) - 6) + 'px">' + v + "</span>";
    }).join("");

    card.innerHTML =
      '<div class="chart-title"><span>Completed per day · ' + (state.task === "all" ? "all tasks" : esc(data.tasks[state.task].label)) + "</span><span><b>" + total + "</b> in " + nDays + " days</span></div>" +
      '<div class="plot">' + svg + '<div class="bars">' + bars + '</div><div class="ylab">' + yl + '</div><div class="xlab">' + labels + "</div></div>" +
      '<div class="tip" id="tip"></div>';

    var tip = document.getElementById("tip");
    var plot = card.querySelector(".plot");
    function show(hit, clientY) {
      var d = days[+hit.getAttribute("data-i")];
      var pr = plot.getBoundingClientRect(), cr = card.getBoundingClientRect(), hr = hit.getBoundingClientRect();
      tip.innerHTML = '<div class="t-date">' + esc(dayName(d.date)) + "</div>" +
        '<div class="t-row">Completed <b>' + d.done + "</b></div>" +
        '<div class="t-row">Runs <b>' + d.runs + "</b></div>" +
        '<div class="t-row">Fuel <b>' + d.fuel + "</b></div>";
      var x = Math.max(85, Math.min(cr.width - 85, hr.left - cr.left + hr.width / 2));
      tip.style.left = x + "px";
      tip.style.top = Math.max(pr.top - cr.top + 70, clientY - cr.top - 12) + "px";
      tip.classList.add("on");
    }
    plot.onmousemove = function (e) {
      var hit = e.target.closest(".hit");
      if (!hit) { tip.classList.remove("on"); return; }
      show(hit, e.clientY);
    };
    plot.onclick = function (e) { var hit = e.target.closest(".hit"); if (hit) show(hit, e.clientY); };
    plot.onmouseleave = function () { tip.classList.remove("on"); };
    document.addEventListener("touchstart", function (e) { if (!plot.contains(e.target)) tip.classList.remove("on"); }, { passive: true });
  }

  function renderDays(list) {
    var el = document.getElementById("days");
    if (!list.length) {
      var hidden = data.runs.length;
      el.innerHTML = '<div class="empty-filter">' + (hidden ? "Your filters are hiding all " + hidden + (hidden === 1 ? " run." : " runs.") : "No runs match these filters.") +
        (hidden ? '<br><button class="chip reset" id="show-all">Show all runs</button>' : "") + "</div>";
      var b = document.getElementById("show-all");
      if (b) b.onclick = function () { state.task = "all"; state.status = "all"; state.range = "all"; save(); renderFilters(); renderFiltered(); };
      return;
    }
    var groups = [], cur = null;
    list.forEach(function (r) {
      if (!cur || cur.date !== r.date) { cur = { date: r.date, runs: [] }; groups.push(cur); }
      cur.runs.push(r);
    });
    el.innerHTML = groups.map(function (g, gi) {
      var key = "day:" + g.date;
      var open = state.open[key] != null ? state.open[key] : gi === 0;
      var full = g.runs.filter(function (r) { return statusOf(r) === "complete"; }).length;
      return '<details class="day" data-key="' + key + '"' + (open ? " open" : "") + ">" +
        "<summary>" + CHEV + '<span class="day-name">' + esc(dayName(g.date)) + "</span>" +
        '<span class="day-count' + (full < g.runs.length ? " short" : "") + '">' + full + "/" + g.runs.length + " " + (g.runs.length === 1 ? "Task" : "Tasks") + "</span></summary>" +
        '<div class="day-body">' + g.runs.map(runRow).join("") + "</div></details>";
    }).join("");
  }

  function runRow(r) {
    var st = statusOf(r);
    var key = "run:" + (r.id || r.date + r.time + r.task);
    var open = state.open[key] === true;
    var res = r.resources && typeof r.resources === "object" ? Object.keys(r.resources).map(function (k) {
      var x = r.resources[k];
      if (!x || typeof x.before !== "number" || typeof x.after !== "number") return "";
      return '<div class="row"><span class="k">' + esc(k) + '</span><span class="v mono">' + x.before + " → " + x.after +
        ' <span class="spent">(−' + Math.max(0, x.before - x.after) + ")</span></span></div>";
    }).join("") : "";
    var issues = Array.isArray(r.issues) ? r.issues : [];
    return '<details class="run" data-key="' + esc(key) + '"' + (open ? " open" : "") + ">" +
      "<summary>" + CHEV +
        '<span class="r-time">' + esc(clockTight(r.time)) + "</span>" +
        '<span class="r-task">' + esc(shortName(r)) + "</span>" +
        '<span class="r-count ' + st + '">' + num(r.completed) + "/" + num(r.requested) + "</span>" +
      "</summary>" +
      '<div class="run-body"><div class="stack">' +
        row("Task", esc(r.label || r.task)) +
        row("Status", STATUS[st].ic + " " + STATUS[st].label, "", st) +
        row("Started", esc(dayName(r.date)) + ", " + esc(clock(r.time))) +
        row("Duration", typeof r.minutes === "number" ? r.minutes + " min" : "—") +
        settingRows(r.settings) +
        res +
        (issues.length ? '<div class="block"><span class="k">Issues</span><ul class="issues">' + issues.map(function (s) { return "<li>" + esc(s) + "</li>"; }).join("") + "</ul></div>" : row("Issues", "None")) +
        (r.notes ? '<div class="block"><span class="k">Notes</span><div class="v">' + esc(r.notes) + "</div></div>" : "") +
        row("Run ID", esc(r.id || "—"), "id") +
      "</div></div></details>";
  }
})();
</script>
</body></html>
